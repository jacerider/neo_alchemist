# Config schema for the fixture plugins.
#
# Kernel tests run with the strict ConfigSchemaChecker, so any fixture plugin
# whose settings are written into a neo_component config entity needs schema
# coverage here — the parent module's catch-all
# `neo_alchemist.neo_component_access.*` is a bare mapping that rejects
# unknown keys.
neo_alchemist.neo_component_access.na_cache_tag_access:
  type: mapping
  label: 'Test cache tag access settings'
  mapping:
    forbid:
      type: boolean
      label: Forbid
    tag:
      type: string
      label: 'Cache tag'

neo_alchemist.neo_component_value.na_mode_first:
  type: mapping
  label: 'Test mode provider (first) settings'
  mapping:
    produce:
      type: string
      label: 'Value to produce'
    produce_empty:
      type: boolean
      label: 'Produce an empty value'
    processing_mode:
      type: string
      label: 'Processing mode'

neo_alchemist.neo_component_slot.na_note:
  type: mapping
  label: 'Test note slot settings'
  mapping:
    note:
      type: string
      label: Note

# The settings object the claim tests point at. Kernel tests run the strict
# schema checker, so the claim cannot be aimed at an ad-hoc config object.
neo_alchemist_test.settings:
  type: config_object
  label: 'Test fixture settings'
  mapping:
    component:
      type: string
      label: 'Component'
