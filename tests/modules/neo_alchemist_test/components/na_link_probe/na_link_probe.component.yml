$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'NA link fixture'
description: >
  A single `link` prop, declared the way any component declares one. The Neo
  Link widget records "open link in new window" as options.attributes.target,
  and the shape has to hand Twig that choice as a top-level `target` — the key
  the generated snippet renders into `target="{{ link.target }}"`.
status: stable
neo: true
props:
  type: object
  properties:
    link:
      type: link
      title: Link
      examples:
        uri: 'internal:/'
        title: 'Example link'
