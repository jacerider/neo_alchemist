components.parent:
  version: VERSION
  neo: true
  js:
    src/js/components-parent.ts: {}
  css:
    component:
      src/css/components-parent.css: {}
  dependencies:
    - core/drupalSettings
    - neo_loader/loader
    - neo_alchemist/component.parent
    - neo_alchemist/component.ajax

components.child:
  version: VERSION
  neo: true
  js:
    src/js/components-child.ts: {}
  dependencies:
    - neo_alchemist/component.child

component.parent:
  version: VERSION
  neo: true
  js:
    src/js/component-parent.ts: {}
  css:
    component:
      src/css/components-parent.css: {}
  dependencies:
    - core/drupal
    - core/once

component.child:
  version: VERSION
  neo: true
  js:
    src/js/component-child.ts: {}
  dependencies:
    # The chunk ends `})(Drupal, once)`. This is the only JS the preview iframe
    # attaches, so there is nothing else on that page to pull these in.
    - core/drupal
    - core/once

component.form:
  version: VERSION
  neo: true
  css:
    component:
      src/css/component-form.css: {}

component.ajax.form:
  version: VERSION
  neo: true
  js:
    src/js/component-ajax-form.ts: {}
  dependencies:
    - core/once
    - core/drupal
    # Calls jQuery() directly, unguarded.
    - core/jquery

component.screenshot:
  version: VERSION
  neo: true
  js:
    src/js/component-screenshot.ts: {}
  css:
    component:
      src/css/component-screenshot.css: {}
  dependencies:
    - neo_alchemist/library.snapdom

component.ajax:
  version: VERSION
  neo: true
  js:
    src/js/component-ajax.ts: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax

component.sort:
  version: VERSION
  neo: true
  js:
    src/js/component-sort.ts: {}
  dependencies:
    - core/once
    - core/drupal

component.library:
  version: VERSION
  neo: true
  js:
    src/js/component-library.ts: {}
  dependencies:
    - core/once
    - core/drupal

component.list:
  version: VERSION
  neo: true
  js:
    src/js/component-list.ts: {}
  dependencies:
    - core/once
    - core/drupal

utilities:
  version: VERSION
  neo:
    import: true
  css:
    theme:
      src/css/_utilities.css: { minified: true }

# Libraries

library.snapdom:
  version: 2.18.0
  license:
    name: MIT
    url: https://github.com/zumerlab/snapdom/blob/main/LICENSE
    gpl-compatible: true
  js:
    lib/js/snapdom.js: { minified: true, attributes: { defer: true } }

field-browser:
  version: VERSION
  neo: { scope: back }
  js:
    src/js/field-browser.ts: {}
  dependencies:
    - core/drupal
    - core/once
    - neo_modal/modal

# Browser-side word count for the `read_time` value provider. Front scope for
# the same reason as `share` below.
read-time:
  version: VERSION
  neo: { scope: front }
  js:
    src/js/read-time.ts: {}
  dependencies:
    - core/drupal
    - core/once

# Native share for the `share` value provider's Web Share API item. Front scope
# only — the module's info.yml declares a bare `neo: true`, which would
# otherwise build this into the admin bundle as well.
share:
  version: VERSION
  neo: { scope: front }
  js:
    src/js/share.ts: {}
  dependencies:
    - core/drupal
    - core/once
