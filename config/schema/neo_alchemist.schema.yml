neo_alchemist.neo_component_access.prop_value:
  type: mapping
  label: 'Prop value'
  mapping:
    props:
      type: sequence
      label: 'Required props'
      sequence:
        type: string
        label: 'Prop'

neo_alchemist.neo_component_shape_fields:
  type: sequence
  label: The shape fields
  sequence:
    type: mapping
    mapping:
      label:
        type: string
        label: Title
      field:
        type: string
        label: Field
      string:
        type: string
        label: String value
      render_field:
        type: string
        label: Render field
      render_field_format:
        type: neo_alchemist.neo_component_render_field_format
      shape_fields:
        type: neo_alchemist.neo_component_shape_fields
      shape_published:
        type: boolean
        label: Shape published
      plugins:
        type: sequence
        label: Plugins
        sequence:
          type: mapping
          label: Plugin
          mapping:
            plugin_id:
              type: string
              label: Plugin ID
              constraints:
                PluginExists:
                  manager: plugin.manager.neo_component_value
                  interface: '\Drupal\neo_alchemist\ComponentValuePluginInterface'
            status:
              type: boolean
              label: 'Status'
            settings:
              type: neo_alchemist.neo_component_value.[%parent.plugin_id]
              nullable: true


neo_alchemist.neo_component_render_field_format:
