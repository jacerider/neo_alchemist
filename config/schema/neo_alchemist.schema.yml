  label: 'Render field format'
  mapping:
    field_label:
      type: string
      label: Field label
    field_plugin:
      type: string
      label: Field plugin
    field_settings:
      type: field.formatter.settings.[%parent.field_plugin]

neo_alchemist.neo_component_options:
  type: sequence
  label: Component ID
  sequence:
    type: mapping
    label: Options
    mapping:
      empty:
        type: boolean
        label: Treat value as empty
      default:
        type: boolean
        label: Treat value as default
      access:
        type: boolean
        label: Disable access


field.field_settings.neo_component_tree:
  type: mapping
  label: 'Component tree settings'
  mapping:
    allow_custom:
      type: boolean
      label: 'Allow custom'
    sizes:
      type: sequence
      label: Sizes
      sequence:
        type: string
        label: 'Size'
        constraints:
          PluginExists:
            manager: plugin.manager.neo_component_size
    defaults:
      type: mapping
      mapping:
        tree:
          type: sequence
          label: 'Tree sections'
          sequence:
            # Each section is either the root (a list of "uuid,component"
            # tuples) or a non-root component subtree (slot name => list of
            # tuples), e.g. the children of a region placed in the default
            # layout. The two forms diverge below this level, so the items are
            # left untyped; the tree structure is validated at runtime by the
            # ComponentTreeStructure constraint.
            type: sequence
            label: 'Tree section'
            sequence:
              type: ignore
              label: 'Component tuple or slot'
        props:
          type: sequence
          sequence:
            type: mapping
            label: 'Component data'
            mapping:
              status:
                type: boolean
                label: Status
              props:
                type: sequence
                label: Prop
                sequence:
                  type: mapping
                  mapping:
                    shape:
                      type: string
                      label: Shape type
                    ref:
                      type: string
                      label: Ref
                    value:
                      type: ignore
                      label: Value
                    options:
                      type: neo_alchemist.neo_component_options

# Style Settings
# Schema for the configuration files of the Neo | Alchemist module.
neo_alchemist.style_settings:
  type: config_object
  label: 'Neo | Alchemist settings'
  mapping:
    styles:
      type: sequence
      label: 'Styles'
      sequence:
        type: mapping
        label: Style
        mapping:
          mode:
            type: string
            label: Mode
          values:
            type: sequence
            label: Values
            sequence:
              type: string
