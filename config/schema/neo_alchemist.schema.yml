neo_alchemist.neo_component_shape_fields:
  type: sequence
  label: The shape fields
  sequence:
    type: mapping
    mapping:
      label:
        type: string
        label: Title
      field:
        type: string
        label: Field
      modifiers:
        type: sequence
        label: Modifiers
        sequence:
          type: neo_alchemist_neo_component_value.[%key]

field.field_settings.neo_component_tree:
  type: mapping
  label: 'Link settings'
  mapping:
    allow_custom:
      type: boolean
      label: 'Allow custom'
    defaults:
      type: sequence
