neo_alchemist.settings:
  type: config_object
  label: 'Neo | Alchemist settings'
  mapping:
    anchor_override_status:
      type: boolean
      label: Allow overriding anchors

neo_alchemist.neo_component.*:
  type: config_entity
  label: Component
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: string
    description:
      type: string
    group:
      type: string
      label: 'Group'
      constraints:
        PluginExists:
          manager: plugin.manager.neo_component_group
    expression:
      type: string
      label: 'Expression'
    schema:
      type: string
      label: 'Schema'
    aggregate:
      type: boolean
      label: 'Aggregate'
    size:
      type: string
      label: 'Size'
      constraints:
        PluginExists:
          manager: plugin.manager.neo_component_size
      nullable: true
    thumbnail:
      type: string
      label: 'Thumbnail'
      nullable: true
    component:
      type: string
      label: 'Single-Directory Component'
      constraints:
        NotBlank: []
        Regex:
          pattern: '/^[a-z0-9_-]+:[a-z0-9_-]+$/'
          message: 'The %value machine name is not valid.'
        PluginExists:
          manager: plugin.manager.sdc
          interface: 'Drupal\Core\Plugin\PluginBase'
    settings:
      type: mapping
      label: Settings
      mapping:
        props:
          type: neo_alchemist.neo_component_settings.props
        filters:
          type: neo_alchemist.neo_component_settings.filters
        slots:
          type: neo_alchemist.neo_component_settings.slots
        access:
          type: neo_alchemist_neo_component_settings.access
    target_entity_type:
      type: string
      label: 'Target Entity Type'
    target_entity_bundle:
      type: string
      label: 'Target Entity Bundle'

neo_alchemist.neo_component_settings.props:
  type: sequence
  label: 'Props'
  sequence:
    type: mapping
    label: 'Prop'
    mapping:
      prop:
        type: string
        label: Prop
      ref:
        type: string
        label: 'Ref'
      field_type:
        type: string
        label: 'Default field type'
        constraints:
          PluginExists:
            manager: plugin.manager.field.field_type
            interface: '\Drupal\Core\Field\FieldItemInterface'
      active:
        type: boolean
        label: Active
      editable:
        type: boolean
        label: Editable
      required:
        type: boolean
        label: Required
      expanded:
        type: sequence
        label: Expanded
        sequence:
          type: string
          label: Nested ID
      plugins:
        type: sequence
        label: Plugins
        sequence:
          type: sequence
          label: Nested ID
          sequence:
            type: mapping
            label: Plugin
            mapping:
              id:
                type: string
                label: 'Value Plugin'
                constraints:
                  Regex:
                    pattern: '/^[a-z0-9_-]+$/'
                    message: 'The %value machine name is not valid.'
                  PluginExists:
                    manager: plugin.manager.neo_component_value
                    interface: '\Drupal\neo_alchemist\ComponentValuePluginInterface'
              settings:
                type: neo_alchemist.neo_component_value.[%parent.id]
                nullable: true

neo_alchemist.neo_component_value.*:
  type: mapping

neo_alchemist.neo_component_value.region_size:
  type: mapping
  label: 'Region size value provider'
  mapping:
