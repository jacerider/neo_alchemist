      type: string
      label: Context

neo_alchemist.neo_component_slot.views:
  type: mapping
  label: Views pager slot provider
  mapping:
    view_id:
      type: string
      label: View ID
    view_display_id:
      type: string
      label: View Display ID
    view_items_per_page:
      type: integer
      label: Items per page
    view_items_offset:
      type: integer
      label: Items offset
    view_arguments:
      type: sequence
      label: The view arguments
      nullable: true
      sequence:
        type: string
        label: 'Argument'

neo_alchemist_neo_component_settings.access:
  type: sequence
  label: 'Access'
  sequence:
    type: mapping
    mapping:
      plugin_id:
        type: string
        label: Plugin ID
        constraints:
          PluginExists:
            manager: plugin.manager.neo_component_access
            interface: '\Drupal\neo_alchemist\ComponentAccessPluginInterface'
      plugin_settings:
