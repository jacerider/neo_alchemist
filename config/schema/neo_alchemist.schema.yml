        label: 'Bundle'
    include:
      type: sequence
      label: Include
      nullable: true
      sequence:
        type: string
        label: 'ID'
    exclude:
      type: sequence
      label: Exclude
      nullable: true
      sequence:
        type: string
        label: 'ID'

neo_alchemist.neo_component_settings.slots:
  type: sequence
  label: 'Slots'
  sequence:
    type: mapping
    label: 'Slot'
    mapping:
      plugins:
        type: sequence
        label: Plugins
        sequence:
          type: mapping
          label: Plugin
          mapping:
            plugin:
              type: string
              label: Plugin ID
              constraints:
                PluginExists:
                  manager: plugin.manager.neo_component_slot
                  interface: '\Drupal\neo_alchemist\ComponentSlotPluginInterface'
            settings:
              type: neo_alchemist.neo_component_slot.[%parent.plugin]
              nullable: true

neo_alchemist.neo_component_slot.*:
  type: mapping

neo_alchemist.neo_component_slot.block:
  type: mapping
  label: 'Block slot provider'
  mapping:
    block_id:
      type: string
      label: 'Block'
      nullable: true

neo_alchemist.neo_component_slot.block_plugin:
  type: mapping
  label: 'Block plugin slot provider'
  mapping:
    block_plugin:
      type: string
      label: 'Block plugin'
      constraints:
        PluginExists:
          manager: plugin.manager.block
          interface: Drupal\Core\Block\BlockPluginInterface
          # Block plugin IDs may not be valid in blocks that are backed by
          # block_content entities that don't exist yet. Therefore, it's okay
          # to consider the fallback plugin ID as valid.
          allowFallback: true
    block_settings:
      type: block.settings.[%parent.block_plugin]

neo_alchemist.neo_component_slot.entity_field:
  type: mapping
  label: 'Entity field slot provider'
  mapping:
    entity:
      type: string
      label: Entity
    field:
      type: string
      label: Field Label
    field_label:
      type: string
      label: Field Label
    field_plugin:
      type: string
      label: Field Plugin
    field_settings:
      type: field.formatter.settings.[%parent.field_plugin]
      label: 'Settings'
    field_third_party_settings:
      # Third party settings are always optional: they're an optional extension
      # point.
      requiredKey: false
      type: sequence
      label: 'Third party settings'
      sequence:
        type: theme_settings.third_party.[%key]

neo_alchemist.neo_component_slot.entity:
  type: mapping
  label: 'Entity slot provider'
  mapping:
    entity_type:
      type: string
      label: Entity Type Id
    bundles:
      type: sequence
      label: Bundles
      nullable: true
      sequence:
        type: string
        label: 'Bundle'
    entity:
      type: string
      label: Entity
    filter:
      type: string
      label: Filter

neo_alchemist.neo_component_slot.form:
