heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
    size:
      title: Size
      type: heading_size
      apply: false
  examples:
    supertitle: Example supertitle
    title: Example title
    subtitle: Example subtitle
  twig:
    prefix: '{% if %name% %}'
    content:
      - '<div{{ %name%.size }}>'
      - '  {% if %name%.supertitle %}<div class="component-supertitle">{{ %name%.supertitle }}</div>{% endif %}'
      - '  <h2 class="component-title">{{ %name%.title }}</h2>'
      - '  {% if %name%.subtitle %}<div class="component-subtitle">{{ %name%.subtitle }}</div>{% endif %}'
      - '</div>'
    suffix: '{% endif %}'

markup:
  title: Markup
  type:
    - string
    - array
  examples: 'Duis in neque a velit semper lacinia vel nec leo.'
  twig:
    prefix: '{% if %name% %}'
    content: '<div class="prose prose-lg">{{ %name% }}</div>'
    suffix: '{% endif %}'

image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type:
        - integer
        - 'null'
    height:
      title: Image height
      type:
        - integer
        - 'null'
  examples:
    src: https://placehold.co/100x100.png
    alt: Example alt
    width: 200
    height: 100
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# To render an image using Neo dynamic styles #}'
      - '{{ neo_image_style(%name%.src, {focal: {width: 200, height: 100}}, %name%.alt) }}'
      - '{# Neo dynamic styles can be:'
      - '  - Exact: {exact: {width: 200, height: 100}}'
      - '  - Size: {size: {width: 200, height: 100}}'
      - '  - Scale: {size: {width: 200}} or {size: {height: 100}}'
      - '  - Scale Crop: {scaleCrop: {width: 200, height: 100, anchor: "center-center"}}'
      - '  - Crop: {crop: {width: 200, height: 100, anchor: "center-center"}}'
      - '  - Focal Scale Crop: {focal: {width: 200, height: 100}}'
      - '  - Focal Width: {focalWidth: {width: 200}}'
      - '#}'
      - '{# Responsive image #}'
      - '{# neo_image(image.src, {sm: {op: "focal", width: 200, height: 100}, md: {op: "focal", width: 400, height: 300}}, image.alt) #}'
      - '{# URL to image #}'
      - '{# neo_image_style_url(%name%.src, {scale: {width: 200}}) #}'
    suffix: '{% endif %}'

image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|theme:\/\/|component:\/\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
  examples: https://placehold.co/100x100.png
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_image_style_url(%name%.src, {scale: {width: 640}}) }}'
    suffix: '{% endif %}'

file:
  title: File
  type: object
  required:
    - src
  properties:
    src:
      title: File URL
      type: file-uri
    title:
      title: File Title
      type: string
    name:
      title: File Name
      type: string
  examples:
    src: https://pdfobject.com/pdf/sample.pdf
    title: Example PDF
    name: sample.pdf

file-uri:
  title: File URL
  type: string
  format: uri-reference
  pattern: ^(\/|theme:\/\/|component:\/\/|https?:\/\/).*\.(?i)(txt|doc|docx|pdf|xls|xlsx|ppt|pptx|odt|ods|odp)(\?.*)?(#.*)?$
  examples: https://pdfobject.com/pdf/sample.pdf
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="{{ neo_uri(%name%.src) }}" target="_blank">{{ %name%.title }}: {{ %name%.name }}</a>'
    suffix: '{% endif %}'

email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
  examples: no-reply@nowhere.com
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="mailto:{{ %name% }}">{{ %name% }}</a>'
    suffix: '{% endif %}'

telephone:
  title: Telephone
  type: string
  example: 612-555-1234
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="tel:{{ %name% }}">{{ %name% }}</a>'
    suffix: '{% endif %}'

uri:
  title: URI
  type: string
  examples: internal:/
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_uri(%name%.uri, %name%.options) }}'
    suffix: '{% endif %}'

link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
    icon:
      title: 'Icon'
      type: string
    target:
      title: 'Target'
      type: string
      enum:
        - _self
        - _blank
    access:
      title: 'Access'
      type: boolean
  examples:
    uri: internal:/
    title: Example title
  twig:
    prefix: '{% if %name% and %name%.access %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}" target="{{ %name%.target }}">'
      - '  {{ %name%.title }}'
      - '</a>'
    suffix: '{% endif %}'

url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
    target:
      title: Open in new window
      type: string
      enum:
        - _self
        - _blank
    access:
      title: 'Access'
      type: boolean
  examples:
    uri: internal:/
    title: Example title
    target: _self
  twig:
    prefix: '{% if %name% and %name%.access %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}" target="{{ %name%.target }}">'
      - '  Example content'
      - '</a>'
    suffix: '{% endif %}'

address:
  title: Address
  type: object
  properties:
    given_name:
      title: 'Given name'
      type: string
    additional_name:
      title: 'Additional name'
      type: string
    family_name:
      title: 'Family name'
      type: string
    organization:
      title: 'Organization'
      type: string
    address_line1:
      title: 'Address line 1'
      type: string
    address_line2:
      title: 'Address line 2'
      type: string
    address_line3:
      title: 'Address line 3'
      type: string
    locality:
      title: 'Locality'
      type: string
    dependent_locality:
      title: 'Dependent locality'
      type: string
    administrative_area:
      title: 'Administrative area'
      type: string
    postal_code:
      title: 'Postal code'
      type: string
    sorting_code:
      title: 'Sorting code'
      type: string
    country_code:
      title: 'Country code'
      type: string
  examples:
    given_name: First Name
    family_name: Last Name
    organization: Organization
    address_line1: 1234 Somewhere Lane
    address_line2: PO Box 123
    locality: Minneapolis
    administrative_area: MN
    postal_code: '55401'
    country_code: 'US'
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% if %name%.given_name or %name%.family_name %}'
      - '  <div>{{ %name%.given_name }} {{ %name%.family_name }}</div>'
      - '{% endif %}'
      - '{% if %name%.organization %}'
      - '  <div>{{ %name%.organization }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line1 %}'
      - '  <div>{{ %name%.address_line1 }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line2 %}'
      - '  <div>{{ %name%.address_line2 }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line3 %}'
      - '  <div>{{ %name%.address_line3 }}</div>'
      - '{% endif %}'
      - '{% if %name%.dependent_locality %}'
      - '  <div>{{ %name%.dependent_locality }}</div>'
      - '{% endif %}'
      - '{% if %name%.locality or %name%.postal_code or %name%.administrative_area %}'
      - '  <div>{{ %name%.locality }}{% if %name%.administrative_area %}{% if %name%.locality %}, {% endif %}{{ %name%.administrative_area }}{% endif %}{% if %name%.postal_code %}{% if %name%.administrative_area or %name%.locality %}, {% endif %} {{ %name%.postal_code }}{% endif %}</div>'
      - '{% endif %}'
    suffix: '{% endif %}'

menu:
  title: Menu
  type: array
  examples:
    - title: Title 1
      description: Description 1
      icon: acorn
      url: internal:/
    - title: Title 2
      description: Description 2
      icon: acorn
      url: internal:/
    - title: Title 3
      description: Description 3
      icon: acorn
      url: internal:/
  items:
    title: Menu Items
    type: object
    required:
      - title
      - url
    properties:
      title:
        title: Title
        type: string
      description:
        title: Description
        type: string
      icon:
        title: Icon
        type: icon
      url:
        title: URI
        type: url
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% for item in %name% %}'
      - '  <a href="{{ neo_uri(item.url.uri, item.url.options) }}">'
      - '    {% if item.icon %}'
      - '      <div>{{ icon(item.icon) }}</div>'
      - '    {% endif %}'
      - '    <div>{{ item.title }}</div>'
      - '    {% if item.description %}'
      - '      <div>{{ item.description }}</div>'
      - '    {% endif %}'
      - '  </a>'
      - '{% endfor %}'
    suffix: '{% endif %}'

breadcrumb:
  title: Breadcrumb
  type: array
  examples:
    - title: Home
      url: internal:/
    - title: Level 1
      url: internal:/
    - title: Level 2
      url: internal:/
    - title: Current Page
      url: ''
  items:
    title: Breadcrumb Items
    type: object
    required:
      - title
    properties:
      title:
        title: Title
        type: string
      url:
        title: URI
        type: url
  twig:
    prefix:
      - '{% if %name% %}'
      - <nav aria-label="{{ 'Breadcrumb'|t }}">
    content:
      - '<ol class="flex items-center flex-wrap">'
      - '{% for item in %name% %}'
      - '  <li class="whitespace-nowrap mr-2">'
      - '    <{% if item.url %}a href="{{ neo_uri(item.url.uri, item.url.options) }}"{% else %}span{% endif %}{% if loop.last %} aria-current="page"{% endif %}>'
      - '      {{ item.title }}'
      - '    </{% if item.url %}a{% else %}span{% endif %}>'
      - '  </li>'
      - '  {% if not loop.last %}'
      - '    <li class="mr-2">/</li>'
      - '  {% endif %}'
      - '{% endfor %}'
      - '</ol>'
    suffix:
      - '</nav>'
      - '{% endif %}'

region:
  title: Region
  type: array
  items:
    title: Component
    type: string

scheme:
  title: Color Scheme
  description: The color scheme of the component.
  type: string
  examples: default

style:
  title: Style
  type: string

containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: container mx-auto xl:max-w-screen-md
    sm:
      label: Small
      value: container mx-auto xl:max-w-screen-lg
    md:
      label: Medium
      value: container mx-auto xl:max-w-screen-xl
    lg:
      label: Large
      value: container mx-auto
    full:
      label: Full
      value: mx-0 max-w-none

spacing:
  title: Spacing
  description: The spacing of the component.
  type: style
  examples: md
  apply: true
  styles:
    xs:
      label: Extra Small
      value: 'component-spacing-xs'
    sm:
      label: Small
      value: 'component-spacing-sm'
    md:
      label: Medium
      value: 'component-spacing'
    lg:
      label: Large
      value: 'component-spacing-lg'
    xl:
      label: XL
      value: 'component-spacing-xl'
    2xl:
      label: 2XL
      value: component-spacing-2xl
    3xl:
      label: 3XL
      value: component-spacing-3xl

text_align:
  title: Text Alignment
  description: The alignment of the text.
  type: style
  examples: left
  styles:
    left:
      label: Left
      value: text-left
    center:
      label: Center
      value: text-center
    right:
      label: Right
      value: text-right

heading_size:
  title: Heading Size
  description: The size of the heading.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: title-xs
    sm:
      label: Small
      value: title-sm
    md:
      label: Medium (recommended for component title)
      value: title-md
    lg:
      label: Large
      value: title-lg
    xl:
      label: XL (recommended for page title)
      value: title-page title-xl
    2xl:
      label: 2XL
      value: title-page title-2xl
    3xl:
      label: 3XL
      value: title-page title-3xl

button_style:
  title: Button Style
  description: The style of the button.
  type: style
  styles:
    base:
      label: 'Base: Solid'
      value: btn
    outline:
      label: 'Base: Outline'
      value: btn btn-outline
    text:
      label: 'Base: Text'
      value: btn btn-text
    primary:
      label: 'Primary: Solid'
      value: btn btn-primary
    primary_outline:
      label: 'Primary: Outline'
      value: btn btn-outline-primary
    primary_text:
      label: 'Primary: Text'
      value: btn btn-text-primary
    secondary:
      label: 'Secondary: Solid'
      value: btn btn-secondary
    secondary_outline:
      label: 'Secondary: Outline'
      value: btn btn-outline-secondary
    secondary_text:
      label: 'Secondary: Text'
      value: btn btn-text-secondary
    accent:
      label: 'Accent: Solid'
      value: btn btn-accent
    accent_outline:
      label: 'Accent: Outline'
      value: btn btn-outline-accent
    accent_text:
      label: 'Accent: Text'
      value: btn btn-text-accent

button_size:
  title: Button Size
  description: The size of the button.
  type: style
  styles:
    xs:
      label: Extra Small
      value: 'btn-xs'
    sm:
      label: Small
      value: 'btn-sm'
    md:
      label: Medium
      value: ''
    lg:
      label: Large
      value: 'btn-lg'
    xl:
      label: XL
      value: 'btn-xl'
    2xl:
      label: 2XL
      value: btn-2xl
    3xl:
      label: 3XL
      value: btn-3xl
