heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type: integer
    height:
      title: Image height
      type: integer
image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
uri:
  title: URI
  type: string
link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
