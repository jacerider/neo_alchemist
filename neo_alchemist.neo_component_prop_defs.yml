heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
markup:
  title: Markup
  type: string
image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type: integer
    height:
      title: Image height
      type: integer
image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
uri:
  title: URI
  type: string
link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
scheme:
  title: Color Scheme
  type: string
  examples: default
style:
  title: Style
  type: string
containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: max-w-xl !mx-0 lg:!mx-auto
    sm:
      label: Small
      value: max-w-5xl !mx-0 lg:!mx-auto
    md:
      label: Medium
      value: max-w-7xl !mx-0 lg:!mx-auto
    lg:
      label: Large
      value: container !mx-0 lg:!mx-auto
    full:
      label: Full
      value: w-full max-w-full lg:!mx-0
padding:
  title: Padding
  description: The inner-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: p-2
    sm:
      label: Small
      value: p-2 md:p-4 lg:p-6
    md:
      label: Medium
      value: p-4 md:p-6 lg:p-14
    lg:
      label: Large
      value: p-10 md:p-16 lg:p-24
    xl:
      label: Extra Large
      value: p-16 md:p-24 lg:p-32
margin:
  title: Margin
  description: The outer-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: m-2 md:m-2 lg:m-2
    sm:
      label: Small
      value: m-2 md:m-4 lg:m-6
    md:
      label: Medium
      value: m-4 md:m-6 lg:m-14
    lg:
      label: Large
      value: m-6 md:m-14 lg:m-24
    xl:
      label: Extra Large
      value: m-12 md:m-20 lg:m-32
