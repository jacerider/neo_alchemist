heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
markup:
  title: Markup
  type: string
image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type: integer
    height:
      title: Image height
      type: integer
image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
uri:
  title: URI
  type: string
link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
scheme:
  title: Color Scheme
  type: string
  examples: default
style:
  title: Style
  type: string
containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: max-w-xl !mx-0 md:!mx-auto
    sm:
      label: Small
      value: max-w-5xl !mx-0 md:!mx-auto
    md:
      label: Medium
      value: max-w-7xl !mx-0 md:!mx-auto
    lg:
      label: Large
      value: container !mx-0 md:!mx-auto
    full:
      label: Full
      value: w-full max-w-full md:!mx-0
padding:
  title: Padding
  description: The inner-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: p-component-xs
    sm:
      label: Small
      value: p-component-sm
    md:
      label: Medium
      value: p-m-componentd
    lg:
      label: Large
      value: p-component-lg
    xl:
      label: Extra Large
      value: p-component-xl
margin:
  title: Margin
  description: The outer-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: m-component-xs
    sm:
      label: Small
      value: m-component-sm
    md:
      label: Medium
      value: m-component
    lg:
      label: Large
      value: m-component-lg
    xl:
      label: Extra Large
      value: m-component-xl
text_align:
  title: Text Alignment
  description: The alignment of the text.
  type: style
  examples: left
  styles:
    left:
      label: Left
      value: text-left
    center:
      label: Center
      value: text-center
    right:
      label: Right
      value: text-right
