heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
  examples:
    supertitle: Example supertitle
    title: Example title
    subtitle: Example subtitle
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% if %name%.supertitle %}<div class="text-xl font-bold">{{ %name%.supertitle }}</div>{% endif %}'
      - '<h2 class="text-3xl font-bold">{{ %name%.title }}</h2>'
      - '{% if %name%.subtitle %}<div class="text-sm">{{ %name%.subtitle }}</div>{% endif %}'
    suffix: '{% endif %}'

markup:
  title: Markup
  type: string
  examples: '<p>ExampleDuis in neque a velit semper lacinia vel nec leo.</p>'
  twig:
    prefix: '{% if %name% %}'
    content: '<div class="prose prose-lg">{{ %name% }}</div>'
    suffix: '{% endif %}'

image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type: integer
    height:
      title: Image height
      type: integer
  examples:
    src: https://placehold.co/100x100.png
    alt: Example alt
    width: 100
    height: 100
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# To render an image using Neo dynamic styles #}'
      - '{{ neo_image_style(%name%.src, {exact: {width: 100, height: 100}}, %name%.alt) }}'
      - '{# To generate a URL to the image #}'
      - '{{ neo_image_style_url(%name%.src, {scale: {width: 640}}) }}'
    suffix: '{% endif %}'

image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
  examples: https://placehold.co/100x100.png
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_image_style_url(%name%.src, {scale: {width: 640}}) }}'
    suffix: '{% endif %}'

email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
  examples: no-reply@nowhere.com
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="mailto:{{ %name% }}">{{ %name% }}</a>'
    suffix: '{% endif %}'

uri:
  title: URI
  type: string
  examples: internal:/
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_uri(%name%.uri, %name%.options) }}'
    suffix: '{% endif %}'

link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
  examples:
    uri: internal:/
    title: Example title
  twig:
    prefix: '{% if %name% %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}">'
      - '  {{ %name%.title }}'
      - '</a>'
    suffix: '{% endif %}'

url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
    target:
      title: Open in new window
      type: string
      enum:
        - _self
        - _blank
  examples:
    uri: internal:/
    title: Example title
    target: _self
  twig:
    prefix: '{% if %name% %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}">'
      - '  Example content'
      - '</a>'
    suffix: '{% endif %}'

menu:
  title: Menu
  type: array
  examples:
    - title: Title 1
      description: Description 1
      icon: acorn
      url: internal:/
    - title: Title 2
      description: Description 2
      icon: acorn
      url: internal:/
    - title: Title 3
      description: Description 3
      icon: acorn
      url: internal:/
  items:
    title: Menu Items
    type: object
    required:
      - title
      - url
    properties:
      title:
        title: Title
        type: string
      description:
        title: Description
        type: string
      icon:
        title: Icon
        type: icon
      url:
        title: URI
        type: url
  twig:
    prefix:
      - '{% if %name% %}'
    content:
      - '{% for item in %name% %}'
      - '  <a href="{{ neo_uri(item.url.uri, item.url.options) }}">'
      - '    {% if item.icon %}'
      - '      <div>{{ icon(item.icon) }}</div>'
      - '    {% endif %}'
      - '    <div>{{ item.title }}</div>'
      - '    {% if item.description %}'
      - '      <div>{{ item.description }}</div>'
      - '    {% endif %}'
      - '  </a>'
      - '{% endfor %}'
    suffix: '{% endif %}'

scheme:
  title: Color Scheme
  description: The color scheme of the component.
  type: string
  examples: default

style:
  title: Style
  type: string

containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: container mx-auto xl:max-w-screen-md
    sm:
      label: Small
      value: container mx-auto xl:max-w-screen-lg
    md:
      label: Medium
      value: container mx-auto xl:max-w-screen-xl
    lg:
      label: Large
      value: container mx-auto
    full:
      label: Full
      value: mx-0 max-w-none

padding:
  title: Padding
  description: The inner-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: p-component-xs
    sm:
      label: Small
      value: p-component-sm
    md:
      label: Medium
      value: p-component
    lg:
      label: Large
      value: p-component-lg
    xl:
      label: Extra Large
      value: p-component-xl

margin:
  title: Margin
  description: The outer-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: m-component-xs
    sm:
      label: Small
      value: m-component-sm
    md:
      label: Medium
      value: m-component
    lg:
      label: Large
      value: m-component-lg
    xl:
      label: Extra Large
      value: m-component-xl

text_align:
  title: Text Alignment
  description: The alignment of the text.
  type: style
  examples: left
  styles:
    left:
      label: Left
      value: text-left
    center:
      label: Center
      value: text-center
    right:
      label: Right
      value: text-right
