heading:
  title: Heading
  type: object
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
    size:
      title: Size
      type: heading_size
      apply: false
    anchor:
      title: Anchor
      type: slug
      description: An anchor will allow linking directly to this component. Just add "#[your-anchor]" to the end of the URL when linking to this page.
  examples:
    supertitle: Example supertitle
    title: Example title
    subtitle: Example subtitle
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% if %name%.anchor %}<a name="{{ %name%.anchor }}" title="{{ %name%.title }}"></a>{% endif %}'
      - '<div{{ %name%.size }}>'
      - '  {% if %name%.supertitle %}<div class="component-supertitle">{{ %name%.supertitle }}</div>{% endif %}'
      - '  {% if %name%.title %}<h2 class="component-title">{{ %name%.title }}</h2>{% endif %}'
      - '  {% if %name%.subtitle %}<div class="component-subtitle">{{ %name%.subtitle }}</div>{% endif %}'
      - '</div>'
    suffix: '{% endif %}'

markup:
  title: Markup
  type:
    - string
    - array
  examples: 'Duis in neque a velit semper lacinia vel nec leo.'
  twig:
    prefix: '{% if %name% %}'
    content: '<div class="prose prose-lg">{{ %name% }}</div>'
    suffix: '{% endif %}'

media:
  title: Media
  type: object
  media_types:
    - image
  required:
    - src
  properties:
    src:
      title: Image URL
      type: uri
    title:
      title: Title
      type: string
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# The entity id #}'
      - '{{ %name%.entity_id }}'
      - '{# The src or entity id depending on the media type source #}'
      - '{{ %name%.src }}'
      - '{# The entity label #}'
      - '{{ %name%.title }}'
      - '{# To rendered full view mode of the entity #}'
      - '{{ %name%.render }}'
    suffix: '{% endif %}'

image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type:
        - integer
        - 'null'
    height:
      title: Image height
      type:
        - integer
        - 'null'
  examples:
    src: https://placehold.co/100x100.png
    alt: Example alt
    width: 200
    height: 100
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# To render an image using Neo dynamic styles #}'
      - '{{ neo_image_style(%name%.src, image.size|default({focal: {width: 200, height: 100}}), %name%.alt) }}'
      - '{# Neo dynamic styles can be:'
      - '  - Exact: {exact: {width: 200, height: 100}}'
      - '  - Size: {size: {width: 200, height: 100}}'
      - '  - Scale: {size: {width: 200}} or {size: {height: 100}}'
      - '  - Scale Crop: {scaleCrop: {width: 200, height: 100, anchor: "center-center"}}'
      - '  - Crop: {crop: {width: 200, height: 100, anchor: "center-center"}}'
      - '  - Focal Scale Crop: {focal: {width: 200, height: 100}}'
      - '  - Focal Width: {focalWidth: {width: 200}}'
      - '#}'
      - '{# Responsive image #}'
      - '{# neo_image(image.src, image.size|default({sm: {op: "focal", width: 200, height: 100}, md: {op: "focal", width: 400, height: 300}}), image.alt) #}'
      - '{# URL to image #}'
      - '{# neo_image_style_url(%name%.src, image.size|default({scale: {width: 200}})) #}'
    suffix: '{% endif %}'

image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|theme:\/\/|component:\/\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp|avif|svg)(\?.*)?(#.*)?$
  examples: https://placehold.co/100x100.png
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_image_style_url(%name%.src, {scale: {width: 640}}) }}'
    suffix: '{% endif %}'

file:
  title: File
  type: object
  required:
    - src
  properties:
    src:
      title: File URL
      type: file-uri
    title:
      title: File Title
      type: string
    name:
      title: File Name
      type: string
  examples:
    src: https://pdfobject.com/pdf/sample.pdf
    title: Example PDF
    name: sample.pdf

file-uri:
  title: File URL
  type: string
  format: uri-reference
  pattern: ^(\/|theme:\/\/|component:\/\/|https?:\/\/).*\.(?i)(txt|doc|docx|pdf|xls|xlsx|ppt|pptx|odt|ods|odp)(\?.*)?(#.*)?$
  examples: https://pdfobject.com/pdf/sample.pdf
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="{{ neo_uri(%name%.src) }}" target="_blank">{{ %name%.title }}: {{ %name%.name }}</a>'
    suffix: '{% endif %}'

remote_video:
  title: Remote Video
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: uri
    thumbnail:
      title: Image URL
      type: image-uri
    thumbnail_width:
      title: Image width
      type:
        - integer
        - 'null'
    thumbnail_height:
      title: Image height
      type:
        - integer
        - 'null'
    title:
      title: Totle
      type: string
  examples:
    src: https://www.youtube.com/watch?v=ScMzIvxBSi4
    thumbnail: https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg
    title: Placeholder Video
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# To render a video as a modal #}'
      - "{{ neo_modal(neo_image_style(%name%.thumbnail, {scaleCrop: {width: 480, height: 360}}, %name%.title), {video: %name%.src}, 'media') }}"
      - '{# To render a video inline #}'
      - '{{ neo_oembed(%name%.src) }}'
    suffix: '{% endif %}'

video:
  title: Video
  type: object
  required:
    - src
  properties:
    src:
      title: Video URL
      type: video-uri
    poster:
      title: Poster Image URL
      # Plain string (not image-uri): the poster is derived from the media
      # thumbnail, never hand-entered, and typing it as image-uri would inject
      # that shape's placehold.co default onto every posterless video.
      type: string
    mime:
      title: MIME Type
      type: string
    width:
      title: Video width
      type:
        - integer
        - 'null'
    height:
      title: Video height
      type:
        - integer
        - 'null'
  examples:
    src: theme://videos/placeholder.mp4
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{# A locally-hosted video. Autoplaying background videos must be muted. #}'
      - '<video autoplay muted loop playsinline preload="auto"{% if %name%.poster %} poster="{{ %name%.poster }}"{% endif %}>'
      - '  <source src="{{ %name%.src }}"{% if %name%.mime %} type="{{ %name%.mime }}"{% endif %}>'
      - '</video>'
    suffix: '{% endif %}'

video-uri:
  title: Video URL
  type: string
  format: uri-reference
  pattern: ^(\/|theme:\/\/|component:\/\/|https?:\/\/).*\.(?i)(mp4|webm|ogg|mov)(\?.*)?(#.*)?$
  examples: theme://videos/placeholder.mp4
  twig:
    prefix: '{% if %name% %}'
    content: '<video src="{{ %name% }}" muted loop playsinline></video>'
    suffix: '{% endif %}'

email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
  examples: no-reply@nowhere.com
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="mailto:{{ %name% }}">{{ %name% }}</a>'
    suffix: '{% endif %}'

telephone:
  title: Telephone
  type: string
  example: 612-555-1234
  twig:
    prefix: '{% if %name% %}'
    content: '<a href="tel:{{ %name% }}">{{ %name% }}</a>'
    suffix: '{% endif %}'

uri:
  title: URI
  type: string
  examples: internal:/
  twig:
    prefix: '{% if %name% %}'
    content: '{{ neo_uri(%name%.uri, %name%.options) }}'
    suffix: '{% endif %}'

link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
    icon:
      title: 'Icon'
      type: string
    target:
      title: 'Target'
      type: string
      enum:
        - _self
        - _blank
    access:
      title: 'Access'
      type: boolean
  examples:
    uri: internal:/
    title: Example title
  twig:
    prefix: '{% if %name% and %name%.access %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}" target="{{ %name%.target }}">'
      - '  {{ %name%.title }}'
      - '</a>'
    suffix: '{% endif %}'

url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
    target:
      title: Open in new window
      type: string
      enum:
        - _self
        - _blank
    access:
      title: 'Access'
      type: boolean
  examples:
    uri: internal:/
    title: Example title
    target: _self
  twig:
    prefix: '{% if %name% and %name%.access %}'
    content:
      - '<a class="btn" href="{{ neo_uri(%name%.uri, %name%.options) }}" target="{{ %name%.target }}">'
      - '  Example content'
      - '</a>'
    suffix: '{% endif %}'

address:
  title: Address
  type: object
  properties:
    given_name:
      title: 'Given name'
      type: string
    additional_name:
      title: 'Additional name'
      type: string
    family_name:
      title: 'Family name'
      type: string
    organization:
      title: 'Organization'
      type: string
    address_line1:
      title: 'Address line 1'
      type: string
    address_line2:
      title: 'Address line 2'
      type: string
    address_line3:
      title: 'Address line 3'
      type: string
    locality:
      title: 'Locality'
      type: string
    dependent_locality:
      title: 'Dependent locality'
      type: string
    administrative_area:
      title: 'Administrative area'
      type: string
    postal_code:
      title: 'Postal code'
      type: string
    sorting_code:
      title: 'Sorting code'
      type: string
    country_code:
      title: 'Country code'
      type: string
  examples:
    given_name: First Name
    family_name: Last Name
    organization: Organization
    address_line1: 1234 Somewhere Lane
    address_line2: PO Box 123
    locality: Minneapolis
    administrative_area: MN
    postal_code: '55401'
    country_code: 'US'
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% if %name%.given_name or %name%.family_name %}'
      - '  <div>{{ %name%.given_name }} {{ %name%.family_name }}</div>'
      - '{% endif %}'
      - '{% if %name%.organization %}'
      - '  <div>{{ %name%.organization }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line1 %}'
      - '  <div>{{ %name%.address_line1 }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line2 %}'
      - '  <div>{{ %name%.address_line2 }}</div>'
      - '{% endif %}'
      - '{% if %name%.address_line3 %}'
      - '  <div>{{ %name%.address_line3 }}</div>'
      - '{% endif %}'
      - '{% if %name%.dependent_locality %}'
      - '  <div>{{ %name%.dependent_locality }}</div>'
      - '{% endif %}'
      - '{% if %name%.locality or %name%.postal_code or %name%.administrative_area %}'
      - '  <div>{{ %name%.locality }}{% if %name%.administrative_area %}{% if %name%.locality %}, {% endif %}{{ %name%.administrative_area }}{% endif %}{% if %name%.postal_code %}{% if %name%.administrative_area or %name%.locality %}, {% endif %} {{ %name%.postal_code }}{% endif %}</div>'
      - '{% endif %}'
    suffix: '{% endif %}'

menu:
  title: Menu
  type: array
  examples:
    - title: Title 1
      description: Description 1
      icon: acorn
      url: internal:/
    - title: Title 2
      description: Description 2
      icon: acorn
      url: internal:/
    - title: Title 3
      description: Description 3
      icon: acorn
      url: internal:/
  items:
    title: Menu Items
    type: object
    required:
      - title
      - url
    properties:
      title:
        title: Title
        type: string
      description:
        title: Description
        type: string
      icon:
        title: Icon
        type: icon
      url:
        title: URI
        type: url
      below:
        title: Children
        type: array
        items:
          title: Menu Items
          type: object
          required:
            - title
            - url
          properties:
            title:
              title: Title
              type: string
            description:
              title: Description
              type: string
            icon:
              title: Icon
              type: icon
            url:
              title: URI
              type: url
  twig:
    prefix: '{% if %name% %}'
    content:
      - '{% for item in %name% %}'
      - '  <a href="{{ neo_uri(item.url.uri, item.url.options) }}"{% if item.in_active_trail %} class="is-active"{% endif %}>'
      - '    {% if item.icon %}'
      - '      <div>{{ icon(item.icon) }}</div>'
      - '    {% endif %}'
      - '    <div>{{ item.title }}</div>'
      - '    {% if item.description %}'
      - '      <div>{{ item.description }}</div>'
      - '    {% endif %}'
      - '  </a>'
      - '  {# Each item also carries Drupal menu-state flags: item.in_active_trail'
      - '     (used above for the active class) plus item.is_expanded /'
      - '     item.is_collapsed. item.below holds nested child items (e.g.'
      - '     dropdowns); this renders one level — for deeper menus move it into a'
      - '     recursive macro. Modules may add further runtime keys via'
      - '     hook_neo_alchemist_menu_value_item_alter(): with neo_alchemist_menu'
      - '     enabled, a mega-menu region item has item.region (TRUE) and'
      - '     item.content (a render array of its component tree — print with'
      - '     {{ item.content }} instead of a link). #}'
      - '  {% if item.below %}'
      - '    {% for child in item.below %}'
      - '      <a href="{{ neo_uri(child.url.uri, child.url.options) }}"{% if child.in_active_trail %} class="is-active"{% endif %}>'
      - '        {% if child.icon %}<div>{{ icon(child.icon) }}</div>{% endif %}'
      - '        <div>{{ child.title }}</div>'
      - '      </a>'
      - '    {% endfor %}'
      - '  {% endif %}'
      - '{% endfor %}'
    suffix: '{% endif %}'

# One exposed views filter as pure data, for fully designed filter UIs. Filled
# by the views_exposed_filter value provider from the same executed view the
# `views` provider binds (so the prop must be declared AFTER the views-bound
# prop). Because an exposed filter is just a GET parameter, options render as
# plain links (single-select) or as a hand-written GET form of checkboxes
# (multi-select) — `action` and `carry` exist so such a form preserves every
# other query arg. `value` is always an array, single-select included, so the
# schema stays one type.
views_filter:
  title: 'Views filter'
  # At render the value is a ViewsFilterTwig helper object; it implements
  # JsonSerializable, so SDC prop validation sees the wrapped data and the
  # object validates exactly like the plain example arrays do.
  type: object
  properties:
    label:
      title: Label
      type: string
    param:
      title: 'Query parameter'
      type: string
    placeholder:
      title: Placeholder
      type: string
    multiple:
      title: Multiple
      type: boolean
    active:
      title: Active
      type: boolean
    active_count:
      title: 'Active count'
      type: integer
    active_labels:
      title: 'Active labels'
      type: array
      items:
        title: Label
        type: string
    value:
      title: 'Current values'
      type: array
      items:
        title: Value
        type: string
    reset_url:
      title: 'Reset URL'
      type: string
    action:
      title: 'Form action'
      type: string
    carry:
      title: 'Carried query args'
      type: array
      items:
        title: 'Hidden input'
        type: object
        properties:
          name:
            title: Name
            type: string
          value:
            title: Value
            type: string
    options:
      title: Options
      type: array
      items:
        title: Option
        type: object
        properties:
          label:
            title: Label
            type: string
          value:
            title: Value
            type: string
          url:
            title: URL
            type: string
          active:
            title: Active
            type: boolean
          below:
            title: Children
            type: array
            items:
              title: Option
              type: object
              properties:
                label:
                  title: Label
                  type: string
                value:
                  title: Value
                  type: string
                url:
                  title: URL
                  type: string
                active:
                  title: Active
                  type: boolean
                below:
                  title: Children
                  type: array
  examples:
    label: Filter
    param: filter
    multiple: false
    active: false
    active_count: 0
    active_labels: []
    value: []
    placeholder: ''
    reset_url: '#'
    action: '#'
    carry: []
    options:
      - label: 'Option one'
        value: '1'
        url: '#'
        active: true
        below: []
      - label: 'Option two'
        value: '2'
        url: '#'
        active: false
        below:
          - label: 'Child option'
            value: '3'
            url: '#'
            active: false
            below: []

# The applied exposed filters of a bound view, as removable-chip data. Filled
# by the views_active_filters value provider (same views context and ordering
# rule as views_filter). Each item is a plain link: its remove_url toggles just
# that value out; clear_url drops every exposed filter. The value is a
# ViewsActiveFiltersTwig helper at render (link()/clearLink() add the
# accessibility attributes); examples stay plain objects.
views_active_filters:
  title: 'Views active filters'
  type: object
  properties:
    active:
      title: Active
      type: boolean
    count:
      title: Count
      type: integer
    clear_url:
      title: 'Clear-all URL'
      type: string
    items:
      title: Items
      type: array
      items:
        title: 'Active filter'
        type: object
        properties:
          param:
            title: 'Query parameter'
            type: string
          filter_label:
            title: 'Filter label'
            type: string
          value:
            title: Value
            type: string
          label:
            title: 'Value label'
            type: string
          remove_url:
            title: 'Remove URL'
            type: string
  examples:
    active: true
    count: 2
    clear_url: '#'
    items:
      - { param: type, filter_label: Type, value: '2', label: 'Case Study', remove_url: '#' }
      - { param: markets, filter_label: Markets, value: '4', label: 'Residential', remove_url: '#' }

breadcrumb:
  title: Breadcrumb
  type: array
  examples:
    - title: Home
      url: internal:/
    - title: Level 1
      url: internal:/
    - title: Level 2
      url: internal:/
    - title: Current Page
      url: ''
  items:
    title: Breadcrumb Items
    type: object
    required:
      - title
    properties:
      title:
        title: Title
        type: string
      url:
        title: URI
        type: url
  twig:
    prefix:
      - '{% if %name% %}'
      - <nav aria-label="{{ 'Breadcrumb'|t }}">
    content:
      - '<ol class="flex items-center flex-wrap">'
      - '{% for item in %name% %}'
      - '  <li class="whitespace-nowrap mr-2">'
      - '    <{% if item.url %}a href="{{ neo_uri(item.url.uri, item.url.options) }}"{% else %}span{% endif %}{% if loop.last %} aria-current="page"{% endif %}>'
      - '      {{ item.title }}'
      - '    </{% if item.url %}a{% else %}span{% endif %}>'
      - '  </li>'
      - '  {% if not loop.last %}'
      - '    <li class="mr-2">/</li>'
      - '  {% endif %}'
      - '{% endfor %}'
      - '</ol>'
    suffix:
      - '</nav>'
      - '{% endif %}'

slug:
  title: Slug
  type: string

region:
  title: Region
  # A region's stored value is a list of child component UUIDs (array), but at
  # render time RegionShape::preRenderValue() turns it into a wrapper render
  # array (an associative array, i.e. a JSON object). Drupal core only exempts
  # render-array props from JSON Schema "type" errors when the prop is at the
  # top level (it looks the value up by the flat property name); for a region
  # nested inside an array item the property path is "parent[delta].region" and
  # the exemption silently fails. Allowing "object" here lets the rendered
  # region pass validation in both the top-level and nested cases.
  # @see \Drupal\Core\Theme\Component\ComponentValidator::validateProps()
  type:
    - array
    - object
  items:
    title: Component
    type: string

scheme:
  title: Color Scheme
  description: The color scheme of the component.
  type: string
  examples: default

image_size:
  title: Image Size
  description: The size of the images.
  type: array

style:
  title: Style
  type: string

containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: container mx-auto xl:max-w-screen-md
    sm:
      label: Small
      value: container mx-auto xl:max-w-screen-lg
    md:
      label: Medium
      value: container mx-auto xl:max-w-screen-xl
    lg:
      label: Large
      value: container mx-auto
    full:
      label: Full
      value: mx-0 max-w-none

spacing:
  title: Spacing
  description: The spacing of the component.
  type: style
  examples: md
  apply: true
  styles:
    xs:
      label: Extra Small
      value: 'component-spacing-xs'
    sm:
      label: Small
      value: 'component-spacing-sm'
    md:
      label: Medium
      value: 'component-spacing'
    lg:
      label: Large
      value: 'component-spacing-lg'
    xl:
      label: XL
      value: 'component-spacing-xl'
    2xl:
      label: 2XL
      value: component-spacing-2xl
    3xl:
      label: 3XL
      value: component-spacing-3xl

gap:
  title: Gap
  description: The gap between this component and others above or below it.
  type: style
  examples: auto
  apply: true
  styles:
    auto:
      label: Auto
      value: 'neo-section neo-section-y'
    keep:
      label: Keep spacing
      value: 'neo-section neo-section-y component-bg-flush-none'
    flush_top:
      label: Flush top
      value: 'neo-section neo-section-y component-flush-t'
    flush_bottom:
      label: Flush bottom
      value: 'neo-section neo-section-y component-flush-b'
    flush_both:
      label: Flush top & bottom
      value: 'neo-section neo-section-y component-flush-t component-flush-b'

text_align:
  title: Text Alignment
  description: The alignment of the text.
  type: style
  examples: left
  styles:
    left:
      label: Left
      value: text-left
    center:
      label: Center
      value: text-center
    right:
      label: Right
      value: text-right

text_size:
  title: Text Size
  description: The size of the text.
  type: style
  examples: md
  styles:
