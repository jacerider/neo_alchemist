heading:
  title: Heading
  type: object
  required:
    - title
  properties:
    supertitle:
      title: Supertitle
      type: string
    title:
      title: Title
      type: string
    subtitle:
      title: Subtitle
      type: string
markup:
  title: Markup
  type: string
image:
  title: Image
  type: object
  required:
    - src
  properties:
    src:
      title: Image URL
      type: image-uri
    alt:
      title: Alternative text
      type: string
    width:
      title: Image width
      type: integer
    height:
      title: Image height
      type: integer
image-uri:
  title: Image URL
  type: string
  format: uri-reference
  pattern: ^(\/|https?:\/\/).*\.(?i)(png|gif|jpg|jpeg|webp)(\?.*)?(#.*)?$
email:
  title: Email
  type: string
  pattern: ^[a-zA-Z0-9.!#$%&\'*+\/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
icon:
  title: Icon
  type: string
uri:
  title: URI
  type: string
link:
  title: Link
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object
url:
  title: Url
  type: object
  properties:
    uri:
      title: 'URI'
      type: uri
    title:
      title: 'Title'
      type: string
    options:
      title: 'Options'
      type: object

menu:
  title: Menu
  type: array
  examples:
    - title: Title 1
      description: Description 1
      icon: acorn
      url: internal:/
    - title: Title 2
      description: Description 2
      icon: acorn
      url: internal:/
    - title: Title 3
      description: Description 3
      icon: acorn
      url: internal:/
  items:
    title: Menu Items
    type: object
    required:
      - title
      - url
    properties:
      title:
        title: Title
        type: string
      description:
        title: Description
        type: string
      icon:
        title: Icon
        type: icon
      url:
        title: URI
        type: url
      target:
        title: Open in new window
        type: boolean

scheme:
  title: Color Scheme
  description: The color scheme of the component.
  type: string
  examples: default
style:
  title: Style
  type: string
containment:
  title: Containment
  description: The horizontal size of the component.
  type: style
  examples: lg
  styles:
    xs:
      label: Extra Small
      value: container mx-auto xl:max-w-screen-sm
    sm:
      label: Small
      value: container mx-auto xl:max-w-screen-md
    md:
      label: Medium
      value: container mx-auto xl:max-w-screen-lg
    lg:
      label: Large
      value: container mx-auto xl:max-w-screen-2xl
    full:
      label: Full
      value: mx-0 max-w-none
padding:
  title: Padding
  description: The inner-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: p-component-xs
    sm:
      label: Small
      value: p-component-sm
    md:
      label: Medium
      value: p-component
    lg:
      label: Large
      value: p-component-lg
    xl:
      label: Extra Large
      value: p-component-xl
margin:
  title: Margin
  description: The outer-spacing of the component.
  type: style
  examples: md
  styles:
    xs:
      label: Extra Small
      value: m-component-xs
    sm:
      label: Small
      value: m-component-sm
    md:
      label: Medium
      value: m-component
    lg:
      label: Large
      value: m-component-lg
    xl:
      label: Extra Large
      value: m-component-xl
text_align:
  title: Text Alignment
  description: The alignment of the text.
  type: style
  examples: left
  styles:
    left:
      label: Left
      value: text-left
    center:
      label: Center
      value: text-center
    right:
      label: Right
      value: text-right
