entity.neo_component.collection:
  path: '/admin/config/neo/alchemist'
  defaults:
    _entity_list: 'neo_component'
    _title: 'Component Library'
  requirements:
    _permission: 'administer neo_alchemist'

neo_alchemist.sdc_preview_list:
  path: '/admin/config/neo/alchemist/preview'
  defaults:
    _title: 'Preview SDC components'
    _controller: '\Drupal\neo_alchemist\Controller\SdcPreviewListController'
  requirements:
    _permission: 'administer neo_alchemist'

neo_alchemist.sdc_preview:
  path: '/admin/config/neo/alchemist/preview/{component}'
  defaults:
    _title: 'Preview SDC component'
    _controller: '\Drupal\neo_alchemist\Controller\SdcPreviewManageController'
  requirements:
    _permission: 'administer neo_alchemist'

neo_alchemist.sdc_preview_frame:
  path: '/admin/config/neo/alchemist/preview/{component}/frame'
  defaults:
    _title: 'Preview SDC component'
    _controller: '\Drupal\neo_alchemist\Controller\SdcPreviewController'
  requirements:
    _permission: 'administer neo_alchemist'
  options:
    _neo_alchemist_preview: TRUE
    _admin_route: FALSE

entity.neo_component.library:
  path: '/admin/config/neo/alchemist/add'
  defaults:
    _title: 'Select base component'
    _controller: '\Drupal\neo_alchemist\Controller\ComponentLibraryController'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.add_form:
  path: '/admin/config/neo/alchemist/add/{component}'
  defaults:
    _controller: '\Drupal\neo_alchemist\Controller\ComponentAddController'
    _title: 'Add a component'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.canonical:
  path: '/admin/config/neo/alchemist/{neo_component}'
  defaults:
    _controller: '\Drupal\neo_alchemist\Controller\ComponentManageController'
    _title_callback: '\Drupal\neo_alchemist\Controller\ComponentManageController::getTitle'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.preview:
  path: '/admin/config/neo/alchemist/{neo_component}/preview'
  defaults:
    _controller: '\Drupal\neo_alchemist\Controller\ComponentPreviewController'
    _title: 'Preview component'
  requirements:
    _permission: 'administer neo_alchemist'
  options:
    _neo_alchemist_preview: TRUE
    _admin_route: FALSE

entity.neo_component.edit_form:
  path: '/admin/config/neo/alchemist/{neo_component}/edit'
  defaults:
    _entity_form: 'neo_component.edit'
    _title: 'Edit a component'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.aggregate_form:
  path: '/admin/config/neo/alchemist/{neo_component}/aggregate'
  defaults:
    _entity_form: 'neo_component.aggregate'
    _title: 'Aggregate component props'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.edit_prop_form:
  path: '/admin/config/neo/alchemist/{neo_component}/prop/{prop}'
  defaults:
    _entity_form: 'neo_component.prop'
    _title: 'Edit a component prop'
  requirements:
    _neo_component_prop: neo_component.prop.manage_value

entity.neo_component.edit_slot_form:
  path: '/admin/config/neo/alchemist/{neo_component}/slot/{slot}'
  defaults:
    _entity_form: 'neo_component.slot'
    _title: 'Edit a component slot'
  requirements:
    _neo_component_slot: neo_component.slot.manage_value

entity.neo_component.add_filter_form:
  path: '/admin/config/neo/alchemist/{neo_component}/filter/add'
  defaults:
    _title: 'Add a component filter'
    _controller: '\Drupal\neo_alchemist\Controller\ComponentFilterAddController'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.edit_filter_form:
  path: '/admin/config/neo/alchemist/{neo_component}/filter/{uuid}'
  defaults:
    _title: 'Edit a component filter'
    _controller: '\Drupal\neo_alchemist\Controller\ComponentFilterEditController'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.add_access_form:
  path: '/admin/config/neo/alchemist/{neo_component}/access/add'
  defaults:
    _title: 'Add a component access'
    _controller: '\Drupal\neo_alchemist\Controller\ComponentAccessAddController'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.edit_access_form:
  path: '/admin/config/neo/alchemist/{neo_component}/access/{uuid}'
  defaults:
    _title: 'Edit a component access'
    _controller: '\Drupal\neo_alchemist\Controller\ComponentAccessEditController'
  requirements:
    _permission: 'administer neo_alchemist'

entity.neo_component.delete_form:
  path: '/admin/config/neo/alchemist/{neo_component}/delete'
  defaults:
    _entity_form: 'neo_component.delete'
    _title: 'Delete a component'
  requirements:
    _permission: 'administer neo_alchemist'

neo_alchemist.component_style_settings:
  path: '/admin/config/neo/alchemist/styles'
  defaults:
    _title: 'Component style settings'
    _form: 'Drupal\neo_alchemist\Form\ComponentStyleSettingsForm'
  requirements:
    _permission: 'administer neo_alchemist'
