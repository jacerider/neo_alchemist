# Alchemist component management routes for Alchemist block entities.
#
# These mirror the entity.{type}.field_ui.alchemist.* route family that the
# neo_alchemist RouteSubscriber generates for field-config hosts. The route
# names must follow that exact pattern because ComponentFieldConfig::toUrl()
# and ComponentField::toUrl() build route names from the host entity type ID.
entity.neo_alchemist_block_host.field_ui.alchemist.manage:
  path: '/admin/config/neo/alchemist/blocks/{neo_alchemist_block}/components/{neo_field}'
  defaults:
    _controller: 'Drupal\neo_alchemist\Controller\InstanceComponentManageController'
    _title_callback: 'Drupal\neo_alchemist\Controller\InstanceComponentManageController::getTitle'
    entity_type_id: neo_alchemist_block_host
  requirements:
    _neo_component_field: 'neo_field.update'
  options:
    _admin_route: TRUE
    parameters:
      neo_alchemist_block:
        type: 'entity:neo_alchemist_block'
      neo_field:
        type: 'neo_alchemist_field'

entity.neo_alchemist_block_host.field_ui.alchemist.preview:
  path: '/admin/config/neo/alchemist/blocks/{neo_alchemist_block}/components/{neo_field}/preview'
