$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Example | Container'
status: stable
description: 'A container with a single content slot.'
neo: true
props:
  type: object
  properties:
    heading:
      type: heading
      title: Heading
      examples:
        supertitle: 'Example supertitle'
        title: 'Example title'
        subtitle: 'Example subtitle'
        h1: 0
    links:
      type: array
      title: Links
      maxItems: 1
      examples:
        -
          link:
            uri: internal:/
            title: Optional Button
          button_style: outline
      items:
        type: object
        title: Link
        properties:
          link:
            type: link
            title: Link
          button_style:
            type: button_style
    containment:
      type: containment
      apply: true
    spacing:
      type: spacing
    gap:
      type: gap
    text_align:
      type: text_align
      title: Text Align
      apply: true
slots:
  content:
    title: Content
