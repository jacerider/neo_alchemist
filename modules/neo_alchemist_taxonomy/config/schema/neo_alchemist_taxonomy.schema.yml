field.field.*.*.*.third_party.neo_alchemist_taxonomy:
  type: mapping
  label: 'Alchemist taxonomy settings'
  mapping:
    level:
      type: integer
      label: 'Term hierarchy level'

neo_alchemist.neo_component_value.taxonomy_menu:
  type: mapping
  label: 'Taxonomy menu value provider'
  mapping:
    vocabulary:
      type: string
      label: 'Vocabulary'
    root:
      type: integer
      label: 'Root term'
    depth:
      type: integer
      label: 'Number of levels'
    description_field:
      type: string
      label: 'Description field'
    icon_field:
      type: string
      label: 'Icon field'
    processing_mode:
      type: string
      label: 'Processing mode'

neo_alchemist.neo_component_value.taxonomy_children:
  type: neo_alchemist.children_match_value
  label: 'Child terms value provider'

neo_alchemist.neo_component_value.taxonomy_siblings:
  type: neo_alchemist.children_match_value
  label: 'Sibling terms value provider'
  mapping:
    exclude_self:
      type: boolean
      label: 'Exclude the current term'
