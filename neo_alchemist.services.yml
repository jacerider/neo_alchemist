services:
  neo_alchemist.settings:
    parent: neo_settings.repository
    arguments: ['neo_alchemist']

  neo_component_page_renderer:
    class: Drupal\neo_alchemist\Render\ComponentPageRenderer
    arguments: ['@renderer', '@html_response.attachments_processor', '@module_handler', '@theme.manager']
    lazy: true
  Drupal\Core\Render\BareHtmlPageRendererInterface: '@neo_component_page_renderer'

  neo_alchemist.preview_builder:
    class: Drupal\neo_alchemist\ComponentPreviewBuilder
    arguments: ['@entity_type.manager', '@plugin.manager.sdc']

  # The two halves of a component value editor: one builds the prop panel, the
  # other reads the submission back out of it. Both value editors — the
  # on-page instance form and the SDC preview workspace — go through these, so
  # the rules a prop value has to survive are stated once.
  neo_alchemist.value_panel_builder:
    class: Drupal\neo_alchemist\ComponentValuePanelBuilder

  neo_alchemist.prop_value_harvester:
    class: Drupal\neo_alchemist\ComponentPropValueHarvester

  # Finds placements whose component no longer exists. A diff over
  # ComponentUsage rather than another sweep of its own.
  neo_alchemist.dangling_component_data:
    class: Drupal\neo_alchemist\DanglingComponentData
    arguments: ['@entity_type.manager', '@neo_alchemist.component_usage', '@renderer']

  # Copies module components declaring `neo_install: true` into the front
  # theme. Driven by hook_modules_installed()/hook_themes_installed(), which
  # between them cover both install orders (see the class docblock).
  neo_alchemist.theme_component_installer:
    class: Drupal\neo_alchemist\ThemeComponentInstaller
    arguments:
      - '@plugin.manager.sdc'
      - '@theme_handler'
      - '@extension.list.theme'
      - '@config.factory'
      - '@file_system'
      - '@library.discovery'
      - '@theme.registry'
      - '@logger.channel.neo_alchemist'
      - '%app.root%'

  logger.channel.neo_alchemist:
    parent: logger.channel_base
    arguments: ['neo_alchemist']

  # neo_build is a runtime dependency of neo (and so always present on a real
  # site) but is not declared by neo_alchemist, and Kernel tests enable a
  # minimal module list. Reference it optionally so the container still
  # compiles without it — the feature simply reports itself unavailable.
  neo_alchemist.sdc_thumbnail_writer:
    class: Drupal\neo_alchemist\SdcThumbnailWriter
    arguments: ['@plugin.manager.sdc', '@?neo_build', '@config.factory', '%app.root%']

  # Cached in cache.discovery, the same bin the SDC definitions live in, so a
  # single `drush cr` invalidates both together and they can never disagree
  # about which components exist. neo_build is optional for the same reason as
  # above; without it only the dev-mode cache bypass is lost.
  neo_alchemist.slot_template_locator:
    class: Drupal\neo_alchemist\Slot\ComponentSlotTemplateLocator
    arguments:
      - '@plugin.manager.sdc'
      - '@extension.path.resolver'
      - '@module_handler'
      - '@cache.discovery'
      - '@config.factory'
      - '%app.root%'
      - '@?neo_build'

  plugin.manager.neo_component_prop_def:
    class: Drupal\neo_alchemist\ComponentPropDefPluginManager
    arguments: ['@module_handler', '@cache.discovery']

  plugin.manager.neo_component_shape:
    class: Drupal\neo_alchemist\ComponentShapePluginManager
    parent: default_plugin_manager

  plugin.manager.neo_component_value:
    class: Drupal\neo_alchemist\ComponentValuePluginManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@plugin.manager.neo_component_value_group']

  plugin.manager.neo_component_group:
    class: Drupal\neo_alchemist\ComponentGroupPluginManager
    arguments: ['@module_handler', '@cache.discovery']

  neo_alchemist.component_subgroup:
    class: Drupal\neo_alchemist\ComponentSubgroupResolver
    arguments: ['@plugin.manager.neo_component_group', '@entity_type.manager', '@entity_type.bundle.info']

  neo_alchemist.inert_component_data:
    class: Drupal\neo_alchemist\InertComponentData
    arguments: ['@entity_type.manager', '@entity_field.manager', '@database', '@state', '@cache.default', '@cache_tags.invalidator']

  neo_alchemist.component_usage:
    class: Drupal\neo_alchemist\ComponentUsage
    arguments: ['@entity_type.manager', '@entity_field.manager', '@database', '@cache.default', '@module_handler', '@neo_alchemist.component_subgroup', '@neo_alchemist.inert_component_data']

  plugin.manager.neo_component_value_group:
    class: Drupal\neo_alchemist\ComponentValueGroupPluginManager
    arguments: ['@module_handler', '@cache.discovery']

  plugin.manager.neo_component_size:
    class: Drupal\neo_alchemist\ComponentSizePluginManager
    arguments: ['@module_handler', '@cache.discovery']

  plugin.manager.neo_component_slot:
    class: Drupal\neo_alchemist\Slot\ComponentSlotPluginManager
    parent: default_plugin_manager

  plugin.manager.neo_component_filter:
    class: Drupal\neo_alchemist\Filter\ComponentFilterPluginManager
    parent: default_plugin_manager

  plugin.manager.neo_component_filter_options:
    class: Drupal\neo_alchemist\Filter\ComponentFilterOptionsPluginManager
    arguments: ['@module_handler', '@cache.discovery']

  plugin.manager.neo_component_access:
    class: Drupal\neo_alchemist\Access\ComponentAccessPluginManager
    parent: default_plugin_manager

  neo_component.slot.factory:
    class: Drupal\neo_alchemist\Slot\ComponentSlotFactory
    arguments:
      - '@plugin.manager.neo_component_slot'
      - '@neo_alchemist.slot_template_locator'
      - '@plugin.manager.element_info'
      - '@theme.registry'

  neo_component.filter.factory:
    class: Drupal\neo_alchemist\Filter\ComponentFilterFactory
    arguments: ['@plugin.manager.neo_component_filter']

  neo_component.access.factory:
    class: Drupal\neo_alchemist\Access\ComponentAccessFactory
    arguments: ['@plugin.manager.neo_component_access']

  # The configured-plugin kinds, and the repository the shared controller and
  # form resolve one through. A new family is added here, not by copying four
  # classes.
  neo_alchemist.configured_plugin_kind.access:
    class: Drupal\neo_alchemist\ConfiguredPlugin\AccessKind
    arguments:
      - '@plugin.manager.neo_component_access'
      - '@neo_component.access.factory'

  neo_alchemist.configured_plugin_kind.filter:
    class: Drupal\neo_alchemist\ConfiguredPlugin\FilterKind
    arguments:
      - '@plugin.manager.neo_component_filter'
      - '@neo_component.filter.factory'

  neo_alchemist.configured_plugin_kinds:
    class: Drupal\neo_alchemist\ConfiguredPlugin\ConfiguredPluginKindRepository
    arguments:
      - '@neo_alchemist.configured_plugin_kind.access'
      - '@neo_alchemist.configured_plugin_kind.filter'

  neo_alchemist.matcher_field:
    class: Drupal\neo_alchemist\Match\MatcherField
    arguments: ['@module_handler', '@entity_type.manager', '@entity_field.manager', '@entity_type.bundle.info', '@router.route_provider']

  neo_alchemist.matcher_reference:
    class: Drupal\neo_alchemist\Match\MatcherReference
    arguments: ['@module_handler', '@entity_type.manager', '@entity_field.manager', '@entity_type.bundle.info']

  neo_alchemist.children_match_mapper:
    class: Drupal\neo_alchemist\ChildrenMatchMapper
    arguments:
      - '@neo_alchemist.matcher_field'
      - '@neo_alchemist.matcher_reference'
      - '@event_dispatcher'
      - '@plugin.manager.neo_component_value'
      - '@plugin.manager.field.formatter'
      - '@module_handler'

  neo_alchemist.route_subscriber:
    class: Drupal\neo_alchemist\EventSubscriber\RouteSubscriber
    arguments: ['@entity_type.manager', '@entity_field.manager']
    tags:
      - { name: event_subscriber }

  neo_alchemist.kernel_subscriber:
    class: Drupal\neo_alchemist\EventSubscriber\KernelSubscriber
    arguments: ['@state', '@entity_type.manager', '@router.builder']
    tags:
      - { name: event_subscriber }

  neo_alchemist.entity_access_checker:
    class: Drupal\neo_alchemist\Access\EntityComponentAccessCheck
    tags:
      - { name: access_check, applies_to: _neo_entity_component }

  neo_alchemist.field_access_checker:
    class: Drupal\neo_alchemist\Access\FieldComponentAccessCheck
    arguments: ['@entity_field.manager']
    tags:
      - { name: access_check, applies_to: _neo_field_component }

  neo_alchemist.neo_field_access_checker:
    class: Drupal\neo_alchemist\Access\ComponentFieldAccessCheck
    tags:
      - { name: access_check, applies_to: _neo_component_field }

  neo_alchemist.neo_component_access_checker:
    class: Drupal\neo_alchemist\Access\ComponentAccessCheck
    tags:
      - { name: access_check, applies_to: _neo_component }

  neo_alchemist.prop_access_checker:
    class: Drupal\neo_alchemist\Access\ComponentPropAccessCheck
    tags:
      - { name: access_check, applies_to: _neo_component_prop }

  neo_alchemist.slot_access_checker:
    class: Drupal\neo_alchemist\Access\ComponentSlotAccessCheck
    tags:
      - { name: access_check, applies_to: _neo_component_slot }

  neo_alchemist.field_param_converter:
    class: Drupal\neo_alchemist\Routing\FieldParamConverter
    tags:
      - { name: paramconverter }
    arguments: ['@entity_type.manager', '@entity_field.manager']

  neo_alchemist.field_component_param_converter:
    class: Drupal\neo_alchemist\Routing\FieldComponentParamConverter
    tags:
      - { name: paramconverter }
    arguments: ['@entity_type.manager', '@entity_field.manager', '@request_stack']

  neo_alchemist.neo_build_event_subscriber:
    class: '\Drupal\neo_alchemist\EventSubscriber\NeoBuildEventSubscriber'
    tags:
      - { name: 'event_subscriber' }

  neo_alchemist.neo_build_inline_event_subscriber:
    class: '\Drupal\neo_alchemist\EventSubscriber\NeoBuildInlineEventSubscriber'
    arguments: ['@entity_type.manager', '@module_handler']
    tags:
      - { name: 'event_subscriber' }

  neo_alchemist.field_match_locator:
    class: '\Drupal\neo_alchemist\Match\FieldMatchLocator'
    arguments: ['@entity_type.manager', '@neo_alchemist.matcher_field', '@cache.data']
